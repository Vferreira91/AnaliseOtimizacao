spring:
  application:
    name: pedidos

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      # Padrão do Hikari. Na Fase 4 este valor é variado para estudar o pool como gargalo.
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # O schema é responsabilidade exclusiva do Flyway; o Hibernate só confere o mapeamento.
    hibernate:
      ddl-auto: validate
    # Desligado de propósito: todo carregamento acontece dentro da camada de serviço,
    # e um acesso LAZY fora da transação aparece como erro em vez de SQL escondido.
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      # Erros (404, 400...) viram respostas comuns em vez de sendError do Tomcat;
      # assim também saem com os cabeçalhos X-SQL-Count / X-Elapsed-Ms.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
# Mostra cada SQL gerado pelo Hibernate no log (útil nas demonstrações de N+1).
# Uso: SPRING_PROFILES_ACTIVE=sql
spring:
  config:
    activate:
      on-profile: sql
  jpa:
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.stat: debug
